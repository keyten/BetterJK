// rend2 leaf flutter A/B (docs/rend2-leaf-flutter.md)
//
// devmap yavin1b (cheats for the debug bits), exec leafflutter_ab.cfg, stand
// close to a tree09_b / tree02_b with trunk and leaves in view.
//
// F8  screenshots: legacy, flutter, normal wobble off, highlight, magnitude
// F7  toggle r_leafFlutter            F6  toggle x8 exaggerated (close-up video)
// F5  toggle freeze (camera motion only, check motion vectors / TAA)
// F4  toggle r_leafFlutterNormal 0 / 0.25 (position vs normal A/B)
// F3  timing: r_speeds 1 for 10 s, flutter off then on, same view
//
// Video: F6 on, stand still 10 s at the trunk (trunk must not move), then
// orbit the tree (no camera dependent motion), then F6 off for production.

set logfile 1
r_autoFoliage 1

set lf_ab_0 "r_leafFlutterDebug 0; r_leafFlutter 0; wait 10; screenshot"
set lf_ab_1 "r_leafFlutter 1; wait 10; screenshot"
set lf_ab_2 "r_leafFlutterNormal 0; wait 10; screenshot; r_leafFlutterNormal 0.25"
set lf_ab_3 "r_leafFlutterDebug 4; wait 10; screenshot"
set lf_ab_4 "r_leafFlutterDebug 9; wait 10; screenshot; r_leafFlutterDebug 0"
set lf_ab "vstr lf_ab_0; vstr lf_ab_1; vstr lf_ab_2; vstr lf_ab_3; vstr lf_ab_4"

set lf_time "r_leafFlutter 0; r_speeds 1; wait 600; r_leafFlutter 1; wait 600; r_speeds 0"

bind F8 "vstr lf_ab"
bind F7 "toggle r_leafFlutter 0 1"
bind F6 "toggle r_leafFlutterDebug 0 1"
bind F5 "toggle r_leafFlutterDebug 0 2"
bind F4 "toggle r_leafFlutterNormal 0 0.25"
bind F3 "vstr lf_time"
