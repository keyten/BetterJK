// rend2 character self-shadowing captures (docs/rend2-character-shadows.md)
//
// Needs a map with sun shadows (r_sunlightMode 1 or 2, r_sunShadowMode 1,
// r_depthPrepass 1); without a map sun use r_forceSun 1. Contact shadows need
// r_contactShadows 1 at renderer start (put it in autoexec, or vid_restart).
// Point shadows need r_dlightMode 2 (latched, vid_restart).
//
//   devmap <sunny map>; exec charshadow_ab.cfg
//   npc spawn stormtrooper / npc spawn reborn   (generic NPCs, several of them)
//
// F9  face close-up camera (third person, looking at the own face)  / F10 normal camera
// F8  A/B series, same view: baseline, caster LOD, soft contact, all fixes
// F7  debug series: cascades, CSM only, contact only, combined, bias, point
//     shadows, Ghoul2 receivers
// F6  toggle r_shadowCasterLod      F5  toggle r_contactShadowSoft
// F4  toggle r_dlightShadowBias     F3  r_shadowCasterStats 1 for 5 s (console log)
// F2  timing: r_speeds 1, fixes off 10 s then on 10 s, same view
//
// Screenshots land in base/screenshots; the console log (logfile 1) keeps the
// r_shadowCasterStats and r_speeds output.

set logfile 1

set cs_face "cg_thirdPerson 1; cg_thirdPersonRange 32; cg_thirdPersonAngle 180; cg_thirdPersonVertOffset 0"
set cs_normal "cg_thirdPersonRange 80; cg_thirdPersonAngle 0; cg_thirdPersonVertOffset 16"

set cs_off "r_shadowCasterLod 0; r_contactShadowSoft 0; r_dlightShadowBias 0"
set cs_on "r_shadowCasterLod 1; r_contactShadowSoft 1; r_dlightShadowBias 1"

set cs_ab_0 "r_shadowDebug 0; vstr cs_off; wait 10; screenshot"
set cs_ab_1 "r_shadowCasterLod 1; wait 10; screenshot; r_shadowCasterLod 0"
set cs_ab_2 "r_contactShadowSoft 1; wait 10; screenshot; r_contactShadowSoft 0"
set cs_ab_3 "r_dlightShadowBias 1; wait 10; screenshot; r_dlightShadowBias 0"
set cs_ab_4 "vstr cs_on; wait 10; screenshot"
set cs_ab "vstr cs_ab_0; vstr cs_ab_1; vstr cs_ab_2; vstr cs_ab_3; vstr cs_ab_4"

set cs_dbg_0 "r_shadowDebug 1; wait 10; screenshot"
set cs_dbg_1 "r_shadowDebug 6; wait 10; screenshot"
set cs_dbg_2 "r_shadowDebug 7; wait 10; screenshot"
set cs_dbg_3 "r_shadowDebug 8; wait 10; screenshot"
set cs_dbg_4 "r_shadowDebug 9; wait 10; screenshot"
set cs_dbg_5 "r_shadowDebug 10; wait 10; screenshot"
set cs_dbg_6 "r_shadowDebug 11; wait 10; screenshot; r_shadowDebug 0"
set cs_dbg "vstr cs_dbg_0; vstr cs_dbg_1; vstr cs_dbg_2; vstr cs_dbg_3; vstr cs_dbg_4; vstr cs_dbg_5; vstr cs_dbg_6"

set cs_stats "r_shadowCasterStats 1; wait 300; r_shadowCasterStats 0"
set cs_time "vstr cs_off; r_speeds 1; wait 600; vstr cs_on; wait 600; r_speeds 0"

bind F10 "vstr cs_normal"
bind F9 "vstr cs_face"
bind F8 "vstr cs_ab"
bind F7 "vstr cs_dbg"
bind F6 "toggle r_shadowCasterLod 0 1"
bind F5 "toggle r_contactShadowSoft 0 1"
bind F4 "toggle r_dlightShadowBias 0 1"
bind F3 "vstr cs_stats"
bind F2 "vstr cs_time"
